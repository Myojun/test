"charCount"></textarea><small id="charCount">0 / 1000자</small></div><div class="form-actions"><button id="saveNotice" class="button primary" type="submit">작성하기</button><button id="deleteNotice" class="button danger" type="button">현재 공지 삭제</button></div><p id="writeStatus" class="status" role="status"></p></form></section></main><footer class="site-footer"><div class="wrap footer-grid"><strong>육군사관학교 운전교육반 · 관리자</strong><a href="https://kma-driving.o-r.kr">예약페이지로 이동</a></div></footer><dialog id="confirmDialog" aria-labelledby="confirmTitle"><h2 id="confirmTitle"></h2><p id="confirmText" class="prewrap"></p><div class="field" id="confirmationField" hidden><label for="confirmationInput">확인 문구</label><input id="confirmationInput" autocomplete="off"><small id="confirmationHint"></small></div><div class="form-actions"><button id="confirmNo" type="button" autofocus>돌아가기</button><button id="confirmYes" type="button" class="button danger">확인</button></div></dialog><dialog id="noteDialog" aria-labelledby="noteTitle"><h2 id="noteTitle">비고</h2><p id="noteText" class="prewrap"></p><button type="button" id="noteClose">닫기</button></dialog></body></html>
